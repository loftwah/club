# Canonical local task runner. The authoritative gate is:
#
#   mise run acceptance
#
# It must operate from a clean local state.
# See docs/14_ACCEPTANCE_CONTRACT.md and docs/17_ADR_ARCHITECTURE.md (ADR-002).

[tools]
node = "24.19.0"
pnpm = "11.23.0"

[tasks.dev]
description = "Run the local Astro dev server backed by workerd (wrangler dev under the hood)."
run = """
set -euo pipefail
pnpm build
node node_modules/wrangler/bin/wrangler.js dev --config dist/server/wrangler.json --persist-to .wrangler/state
"""

[tasks.check]
description = "Fast check: format, lint, typecheck, unit tests."
run = """
set -euo pipefail
node node_modules/prettier/bin/prettier.cjs --check .
node node_modules/eslint/bin/eslint.js . --max-warnings=0
node node_modules/astro/bin/astro.mjs check
node node_modules/typescript/bin/tsc --noEmit
node node_modules/vitest/vitest.mjs run tests/unit
node --test scripts/cf-preview.test.mjs
"""

[tasks.test]
description = "Run all tests (unit + integration + script tests)."
run = """
set -euo pipefail
node node_modules/vitest/vitest.mjs run tests/unit
node node_modules/vitest/vitest.mjs run tests/integration
node --test scripts/cf-preview.test.mjs
"""

[tasks."cf:preview:status"]
description = "Read-only Preview status: derived names, current Preview settings, recent production deployments."
run = "node scripts/cf-preview.mjs status"

[tasks."cf:preview:create"]
description = "Provision Preview-only KV/D1/R2, apply migrations, and create a Preview for the current branch (refuses main)."
run = "node scripts/cf-preview.mjs create"

[tasks."cf:preview:update"]
description = "Update the Preview for the current branch (refuses main)."
run = "node scripts/cf-preview.mjs update"

[tasks."cf:preview:smoke"]
description = "HTTP-smoke the stable Preview URL (refuses main)."
run = "node scripts/cf-preview.mjs smoke"

[tasks."cf:preview:delete"]
description = "Delete the Preview and clean up Preview-only KV/D1/R2 (refuses main; ownership-proven)."
run = "node scripts/cf-preview.mjs delete"

[tasks."cf:preview:orphans"]
description = "Read-only: list Preview-named KV/D1/R2 candidates that look unused. Does not delete."
run = "node scripts/cf-preview.mjs orphans"

[tasks.acceptance]
description = "Authoritative local acceptance. Operates from a clean local state."
run = """
set -euo pipefail
node scripts/acceptance.mjs
"""

[tasks.deploy-staging]
description = "Refuse deployment until an isolated staging Worker and resources are configured."
run = """
set -euo pipefail
echo "No isolated staging environment is configured; refusing to target production resources." >&2
exit 1
"""

[tasks.deploy-production]
description = "Run acceptance, then deploy to production."
run = """
set -euo pipefail
mise run acceptance
node node_modules/wrangler/bin/wrangler.js deploy --config dist/server/wrangler.json
"""

[tasks.reset-local]
description = "Wipe .wrangler/state and re-apply migrations from zero."
run = """
set -euo pipefail
rm -rf .wrangler
node node_modules/wrangler/bin/wrangler.js d1 migrations apply social-club --local
"""

[tasks.contracts]
description = "CREDENTIALLED provider contract tests. Loads .env via node --env-file=.env. NOT part of default acceptance."
run = """
set -euo pipefail
node --env-file=.env scripts/resend-contract.mjs
"""

[tasks."contracts:minimax"]
description = "CREDENTIALLED MiniMax contract verification. Loads .env via node --env-file=.env. NOT part of default acceptance."
run = """
set -euo pipefail
node --env-file=.env scripts/minimax-contract.mjs
"""

[tasks."video:studio"]
description = "Open the Plans With You motion-design lab in Remotion Studio."
run = "pnpm video:studio"

[tasks."video:status"]
description = "Report CURRENT, STALE or MISSING for the four canonical commercial videos."
run = "pnpm video:status"

[tasks."video:render"]
description = "Render one canonical composition by id, or all when no id is supplied."
run = "node scripts/video/render.mjs"

[tasks."video:render:all"]
description = "Render delivery, master and poster files for all canonical commercial videos."
run = "pnpm video:render:all"

[tasks."video:storyboard"]
description = "Build contact sheets for all canonical delivery renders."
run = "pnpm video:storyboard"

[tasks."video:qc"]
description = "Run deterministic technical QC against all canonical delivery renders."
run = "pnpm video:qc"

[tasks."video:publish"]
description = "Publish approved canonical creative and inventory to versioned R2 prefixes."
run = "pnpm video:publish"
