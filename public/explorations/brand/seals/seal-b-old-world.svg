<?xml version="1.0" encoding="UTF-8"?>
<!--
  Direction B seal · "Old-World Society"
  Production seal for the working name "The Reserved Society".
  Rope-twist outer border, high-contrast Roman display monogram,
  arc text in serif small caps with twin star separators,
  engraved-style Roman date beneath.
  Pure SVG; no raster, no AI-typography. Safe to ship.
  Replaces the conceptual reference at explorations/brand/assets/b/seal_001.jpg
  with a clean, reletterable production version.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img"
     aria-label="The Reserved Society seal — old-world">
  <title>The Reserved Society (Old-World)</title>
  <defs>
    <!-- rope-twist border built from two interleaved circles -->
    <pattern id="rope-b" x="0" y="0" width="8" height="8"
             patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <circle cx="4" cy="4" r="3" fill="none" stroke="currentColor" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="3" fill="none" stroke="currentColor" stroke-width="0.8"/>
      <circle cx="8" cy="0" r="3" fill="none" stroke="currentColor" stroke-width="0.8"/>
      <circle cx="0" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="0.8"/>
      <circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="0.8"/>
    </pattern>
    <path id="arc-top-b" d="M 38 120 A 82 82 0 0 1 202 120" fill="none"/>
    <path id="arc-bot-b" d="M 46 144 A 74 74 0 0 0 194 144" fill="none"/>
  </defs>

  <!-- rope-twist outer band -->
  <circle cx="120" cy="120" r="112" fill="none" stroke="currentColor" stroke-width="0.6"/>
  <circle cx="120" cy="120" r="108" fill="url(#rope-b)" stroke="none"/>
  <circle cx="120" cy="120" r="96" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <circle cx="120" cy="120" r="88" fill="none" stroke="currentColor" stroke-width="0.4"/>

  <!-- top arc text: THE ★ RESERVED ★ SOCIETY -->
  <text fill="currentColor" font-family="'Cormorant Garamond', 'GT Sectra', 'Source Serif 4', serif"
        font-size="11" letter-spacing="2.5" text-anchor="middle">
    <textPath href="#arc-top-b" startOffset="50%">THE  ✻  RESERVED  ✻  SOCIETY</textPath>
  </text>

  <!-- bottom arc text: founding date -->
  <text fill="currentColor" font-family="'Cormorant Garamond', 'GT Sectra', 'Source Serif 4', serif"
        font-size="9" letter-spacing="2" text-anchor="middle" font-style="italic">
    <textPath href="#arc-bot-b" startOffset="50%">EST  ·  MMXXVI</textPath>
  </text>

  <!-- interlocked R/S monogram with leaf ornament, centre -->
  <g transform="translate(120 120)" fill="currentColor">
    <!-- R: high-contrast serif R -->
    <g transform="translate(-6 0)">
      <rect x="-18" y="-28" width="5" height="56"/>
      <path d="M -13 -28 H 4 a 14 14 0 0 1 0 28 H -13 V -28 Z
               M -13 -23 H 4 a 9 9 0 0 1 0 18 H -13 V -23 Z" fill="currentColor"/>
      <path d="M -3 0 L 12 28 L 6 28 L -9 0 Z" fill="currentColor"/>
      <!-- small leaf at the R's terminal -->
      <path d="M 12 28 q 6 -2 8 -8 q -6 0 -8 8 Z" fill="currentColor" opacity="0.85"/>
    </g>
    <!-- S: interlocked, slightly offset -->
    <g transform="translate(8 0)" opacity="0.95">
      <path d="M 14 -22 a 14 14 0 0 0 -14 14 a 14 14 0 0 0 14 14
               a 14 14 0 0 1 0 14 a 14 14 0 0 1 -14 -2
               l 0 -6 a 8 8 0 0 0 14 -2 a 8 8 0 0 0 -14 -14
               a 8 8 0 0 0 0 -16 Z" fill="currentColor"/>
    </g>
  </g>
</svg>
