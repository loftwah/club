<?xml version="1.0" encoding="UTF-8"?>
<!--
  Direction C seal · "Quiet Modern"
  Production seal for the working name "The Reserved Society".
  Hand-drawn monoline circle (slightly imperfect via quadratic curves),
  hand-drawn R monogram, mono small-caps arc text.
  Pure SVG; no raster, no AI-typography. Safe to ship.
  This seal intentionally reads as DRAWN, not engraved — that is the
  point of direction C and the visual reference at
  explorations/brand/assets/c/seal_001.jpg.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img"
     aria-label="The Reserved Society seal — hand-drawn">
  <title>The Reserved Society (Quiet Modern)</title>
  <defs>
    <path id="arc-top-c" d="M 40 122 Q 120 38 200 122" fill="none"/>
    <path id="arc-bot-c" d="M 50 150 Q 120 218 190 150" fill="none"/>
  </defs>

  <!-- slightly wobbly hand-drawn outer ring -->
  <path d="M 30 120
           C 30 60, 70 30, 122 30
           C 174 30, 212 62, 210 120
           C 210 178, 172 210, 120 210
           C 68 210, 30 178, 30 120 Z"
        fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>

  <!-- top arc text -->
  <text fill="currentColor" font-family="ui-monospace, 'JetBrains Mono', 'IBM Plex Mono', monospace"
        font-size="9" letter-spacing="2.5" text-anchor="middle">
    <textPath href="#arc-top-c" startOffset="50%">THE  RESERVED  SOCIETY</textPath>
  </text>

  <!-- bottom arc text: founding date -->
  <text fill="currentColor" font-family="ui-monospace, 'JetBrains Mono', 'IBM Plex Mono', monospace"
        font-size="9" letter-spacing="2" text-anchor="middle">
    <textPath href="#arc-bot-c" startOffset="50%">EST  ·  MMXXVI</textPath>
  </text>

  <!-- hand-drawn R monogram, slightly off-axis -->
  <g transform="translate(120 124) rotate(-3)" fill="none" stroke="currentColor"
     stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- vertical stem with a slight wobble -->
    <path d="M -10 -28 C -10.5 -10, -9.5 8, -10 28"/>
    <!-- bowl of the R -->
    <path d="M -10 -28 C 4 -28, 16 -20, 14 -10 C 12 -2, 2 0, -10 0"/>
    <!-- leg of the R -->
    <path d="M -4 -2 C 4 8, 12 18, 18 28"/>
  </g>
</svg>
