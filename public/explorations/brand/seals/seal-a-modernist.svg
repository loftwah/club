<?xml version="1.0" encoding="UTF-8"?>
<!--
  Direction A seal · "Modernist Institution"
  Production seal for the working name "The Reserved Society".
  Monoline circle, interlocked R/S monogram, arc text in mono small caps.
  Pure SVG; no raster, no AI-typography. Safe to ship.
  Recreates the visual reference at explorations/brand/assets/a/seal_001.jpg
  without inheriting the AI-garbled text that reference contains.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img"
     aria-label="The Reserved Society seal">
  <title>The Reserved Society</title>
  <defs>
    <!-- arc paths for the top and bottom curved text -->
    <path id="arc-top-a" d="M 30 120 A 90 90 0 0 1 210 120" fill="none"/>
    <path id="arc-bot-a" d="M 38 144 A 82 82 0 0 0 202 144" fill="none"/>
  </defs>

  <!-- monoline outer rule -->
  <circle cx="120" cy="120" r="110" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <!-- inner monoline rule (creates the institutional border) -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="currentColor" stroke-width="0.6"/>

  <!-- top arc text: THE RESERVED SOCIETY -->
  <text fill="currentColor" font-family="ui-monospace, 'JetBrains Mono', 'IBM Plex Mono', monospace"
        font-size="9" letter-spacing="3.5" text-anchor="middle">
    <textPath href="#arc-top-a" startOffset="50%">THE  RESERVED  SOCIETY</textPath>
  </text>

  <!-- bottom arc text: founding date in roman numerals -->
  <text fill="currentColor" font-family="ui-monospace, 'JetBrains Mono', 'IBM Plex Mono', monospace"
        font-size="9" letter-spacing="2.5" text-anchor="middle">
    <textPath href="#arc-bot-a" startOffset="50%">EST  ·  MMXXVI</textPath>
  </text>

  <!-- interlocked R/S monogram, centre -->
  <g transform="translate(120 120)" fill="currentColor" stroke="currentColor" stroke-width="0">
    <!-- R: vertical stem + bowl + leg, geometric grotesque -->
    <path d="M -22 -22 H -8 a 14 14 0 0 1 0 28 H -22 V 22 H -28 V -22 H -22 Z
             M -8 -18 H -22 V 2 H -8 a 10 10 0 0 0 0 -20 Z" fill="currentColor"/>
    <!-- S: nested under the R's bowl, smaller and lighter weight to read as interlocked -->
    <path d="M 4 -8 a 12 12 0 0 1 22 6 H 18 a 6 6 0 0 0 -12 0 a 6 6 0 0 0 6 6
             a 12 12 0 0 1 0 24 a 12 12 0 0 1 -12 -6 H 8
             a 6 6 0 0 0 12 0 a 6 6 0 0 0 -6 -6 a 12 12 0 0 1 -10 -24 Z"
          fill="currentColor" opacity="0.92"/>
  </g>
</svg>
